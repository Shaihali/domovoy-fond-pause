<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Домовой фонд</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314241F'/%3E%3Cpath d='M10 31 L32 12 L54 31' fill='none' stroke='%23E8B84A' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='17' y='30' width='30' height='22' rx='2' fill='%23E8B84A'/%3E%3Crect x='28' y='38' width='8' height='14' rx='1' fill='%2314241F'/%3E%3C/svg%3E">
<style>
  :root { --bg: #14241F; --panel: #1D3830; --text: #F4EFE2; --soft: #B9C9C3; --gold: #E8B84A; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: 'Public Sans', 'Segoe UI', Arial, sans-serif; line-height: 1.5;
    padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 520px; background: var(--panel); border-radius: 24px; padding: 40px 32px; }
  .icon { width: 72px; height: 72px; display: block; margin-bottom: 24px; }
  h1 { margin: 0 0 8px; font-size: 34px; line-height: 1.1; }
  .tag { margin: 0 0 20px; color: var(--gold); font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  p { margin: 0 0 12px; font-size: 18px; color: var(--soft); }
  p strong { color: var(--text); font-weight: 600; }
  @media (max-width: 420px) { main { padding: 28px 20px; } h1 { font-size: 28px; } }
</style>
</head>
<body>
<main>
  <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#14241F"/>
    <path d="M10 31 L32 12 L54 31" fill="none" stroke="#E8B84A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="17" y="30" width="30" height="22" rx="2" fill="#E8B84A"/>
    <rect x="28" y="38" width="8" height="14" rx="1" fill="#14241F"/>
  </svg>
  <p class="tag">Домовой фонд</p>
  <h1>Сервис приостановлен</h1>
  <p>Ваши данные сохранены. До возобновления работы обратитесь к <strong>Шайхали</strong>.</p>
</main>
</body>
</html>
